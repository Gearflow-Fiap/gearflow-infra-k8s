apiVersion: v1
kind: Secret
metadata:
  name: gearflow-secret
  namespace: gearflow
type: Opaque
stringData:
  # Gerenciado via Terraform (terraform/app.tf) com inputs do gearflow-infra-database.
  # NÃO editar manualmente — substituir os placeholders abaixo apenas em ambiente local.
  ConnectionStrings__DefaultConnection: "Server=<DB_ENDPOINT>,<DB_PORT>;Database=<DB_NAME>;User Id=<DB_USER>;Password=<DB_PASSWORD>;Encrypt=True;TrustServerCertificate=False"
  Jwt__SigningKey: "<JWT_SIGNING_KEY>"
